services:
  mysql:
    image: mysql:8.0
    container_name: studydemo-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: springboot
      MYSQL_DATABASE: studydemo
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: studydemo-app
    depends_on:
      - mysql
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/studydemo
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: springboot

volumes:
  mysql_data: