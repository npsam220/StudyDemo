# アプリケーション名
spring.application.name=StudyDemo

# データベース接続設定（MySQL）
spring.datasource.url=jdbc:mysql://localhost:3307/studydemo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo
spring.datasource.username=root
spring.datasource.password=springboot

# JPA（Hibernate）の設定
# テーブルが存在しない場合は自動作成、変更があれば更新
spring.jpa.hibernate.ddl-auto=update

# 実行されるSQLをコンソールに表示
spring.jpa.show-sql=true


# SQLを見やすいフォーマットで出力
spring.jpa.properties.hibernate.format_sql=true

# ログファイルの出力先
logging.file.name=app.log

# 存在しないURLにアクセスした場合、例外をスローする設定
# （ControllerAdviceで404エラーをハンドリングするため）
spring.mvc.throw-exception-if-no-handler-found=true

# 静的リソースのマッピングは無効化しないこと
# ※これを有効にすると /static 配下のHTMLが表示されなくなるため注意
# spring.web.resources.add-mappings=false

