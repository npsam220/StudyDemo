# アプリケーション名
spring.application.name=StudyDemo

# データベース接続設定（MySQL）
# spring.datasource.url=jdbc:mysql://localhost:3307/studydemo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo
#spring.datasource.url=jdbc:mysql://studydemo-mysql:3306/studydemo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo
spring.datasource.url=jdbc:mysql://localhost:3306/studydemo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo
spring.datasource.username=root
spring.datasource.password=springboot
spring.batch.jdbc.initialize-schema=always

# JPA（Hibernate）の設定
# テーブルが存在しない場合は自動作成、変更があれば更新
spring.jpa.hibernate.ddl-auto=update

# 実行されるSQLをコンソールに表示
spring.jpa.show-sql=false


# SQLを見やすいフォーマットで出力
spring.jpa.properties.hibernate.format_sql=false

# ログファイルの出力先
logging.file.name=app.log

# 存在しないURLにアクセスした場合、例外をスローする設定
# （ControllerAdviceで404エラーをハンドリングするため）
spring.mvc.throw-exception-if-no-handler-found=true

# 静的リソースのマッピングは無効化しないこと
# ※これを有効にすると /static 配下のHTMLが表示されなくなるため注意
# spring.web.resources.add-mappings=false

spring.batch.job.enabled=false
spring.sql.init.mode=always

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# MyBatisの設定
mybatis.mapper-locations=classpath:mapper/*.xml
# MyBatisの設定（キャメルケース変換）
mybatis.configuration.map-underscore-to-camel-case=true

# ============================================
# Redis 基本連線設定
# ============================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
# 如果你的 Redis 有設定密碼，請取消註解並填寫
# spring.data.redis.password=your_password
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# ============================================
# Lettuce 連線池設定 (選填，高併發環境建議配置)
# ============================================
# 連線池最大連線數 (負數表示不限制)
spring.data.redis.lettuce.pool.max-active=8
# 連線池中的最大空閒連線
spring.data.redis.lettuce.pool.max-idle=8
# 連線池中的最小空閒連線
spring.data.redis.lettuce.pool.min-idle=0
# 連線池分配連線時的最大等待時間 (超過會拋出異常，-1ms 表示無限等待)
spring.data.redis.lettuce.pool.max-wait=1000ms

# 快取類型指定為 redis
spring.cache.type=redis

# 快取預設過期時間 (例如：1 小時)
spring.cache.redis.time-to-live=3600000ms

# 是否允許快取 null 值 (防止快取穿透)
spring.cache.redis.cache-null-values=true

# 是否自動為快取 Key 加上前綴
spring.cache.redis.use-prefix=true