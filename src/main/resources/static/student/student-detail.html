<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>学生詳細情報</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        axios.defaults.xsrfCookieName = "XSRF-TOKEN";
        axios.defaults.xsrfHeaderName = "X-XSRF-TOKEN";
    </script>

</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            React.useEffect(() => {
                axios.get("/csrf");
            }, []);
            // 編集対象の学生データをsessionStorageから取得
            const savedStudent = sessionStorage.getItem("StudentDetail");
            // JSON文字列をオブジェクトに変換して初期値とする
            const initialStudent = savedStudent !== null
                ? JSON.parse(savedStudent)
                : null;
            return (
                <div className="mx-auto max-w-4xl px-4 py-8">
                    <div className="mb-6 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
                        <h1 className="text-3xl font-bold text-slate-900">学生詳細情報</h1>
                        <button
                            className="inline-flex items-center justify-center rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-200"
                            type="button"
                            onClick={() => location.href = "/student/student-management.html"}
                        >
                            一覧へ戻る
                        </button>
                    </div>

                    {initialStudent ? (
                        <div className="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
                            <div className="bg-slate-900 px-5 py-4 text-lg font-semibold text-white">
                                {initialStudent.studentName}
                            </div>
                            <div className="divide-y divide-slate-200">
                                <div className="grid gap-1 px-5 py-4 sm:grid-cols-3 sm:gap-4">
                                    <dt className="text-sm font-medium text-slate-500">学籍番号</dt>
                                    <dd className="text-sm text-slate-900 sm:col-span-2">{initialStudent.studentNo}</dd>
                                </div>

                                <div className="grid gap-1 px-5 py-4 sm:grid-cols-3 sm:gap-4">
                                    <dt className="text-sm font-medium text-slate-500">名前</dt>
                                    <dd className="text-sm text-slate-900 sm:col-span-2">{initialStudent.studentName}</dd>
                                </div>

                                <div className="grid gap-1 px-5 py-4 sm:grid-cols-3 sm:gap-4">
                                    <dt className="text-sm font-medium text-slate-500">性別</dt>
                                    <dd className="text-sm text-slate-900 sm:col-span-2">{initialStudent.gender === "M" ? "男性" : "女性"}</dd>
                                </div>

                                <div className="grid gap-1 px-5 py-4 sm:grid-cols-3 sm:gap-4">
                                    <dt className="text-sm font-medium text-slate-500">学部・学科</dt>
                                    <dd className="text-sm text-slate-900 sm:col-span-2">{initialStudent.department}</dd>
                                </div>

                                <div className="grid gap-1 px-5 py-4 sm:grid-cols-3 sm:gap-4">
                                    <dt className="text-sm font-medium text-slate-500">email</dt>
                                    <dd className="break-all text-sm text-slate-900 sm:col-span-2">{initialStudent.email}</dd>
                                </div>

                                <div className="grid gap-1 px-5 py-4 sm:grid-cols-3 sm:gap-4">
                                    <dt className="text-sm font-medium text-slate-500">電話番号</dt>
                                    <dd className="text-sm text-slate-900 sm:col-span-2">{initialStudent.phone}</dd>
                                </div>
                                <div className="grid gap-1 px-5 py-4 sm:grid-cols-3 sm:gap-4">
                                    <dt className="text-sm font-medium text-slate-500">生日</dt>
                                    <dd className="text-sm text-slate-900 sm:col-span-2">{initialStudent.birthday}</dd>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="rounded-md border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800" role="alert">
                            学生データが見つかりません。
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />); 
    </script>
</body>

</html>
